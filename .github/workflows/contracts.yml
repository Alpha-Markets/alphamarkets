name: contracts

on:
  push:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv --fuzz-runs 10000

      # Gate on the contracts (highest-risk surface). The thresholds sit a little under today's
      # numbers (about 94% of lines, 62% of branches) so a PR cannot quietly erode coverage.
      - name: Coverage
        run: |
          forge coverage --report summary --no-match-coverage "(test|script|lib)" \
            | python3 script/check-coverage.py 90 55
